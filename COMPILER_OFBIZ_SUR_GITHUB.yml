name: Compiler Apache OFBiz 24.09.08

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Telecharger les sources officielles Apache OFBiz 24.09.08
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 4 \
            'https://downloads.apache.org/ofbiz/apache-ofbiz-24.09.08.zip' \
            --output apache-ofbiz-24.09.08.zip
          unzip -q apache-ofbiz-24.09.08.zip
          test -f apache-ofbiz-24.09.08/build.gradle
          java -version
          gradle --version

      - name: Compiler, initialiser les donnees et produire la distribution
        shell: bash
        run: |
          set -euo pipefail
          cd apache-ofbiz-24.09.08
          gradle --no-daemon --max-workers=2 --stacktrace \
            cleanAll loadAll distZip 2>&1 | tee ../COMPILATION_OFBIZ.log

      - name: Lancer les tests d'integration (resultat signale separement)
        if: success()
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          cd apache-ofbiz-24.09.08
          gradle --no-daemon --max-workers=2 --stacktrace \
            testIntegration 2>&1 | tee ../TESTS_INTEGRATION_OFBIZ.log

      - name: Preparer les morceaux a transmettre via ChatGPT
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p OFBIZ_PIECES
          shopt -s nullglob
          archives=(apache-ofbiz-24.09.08/build/distributions/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo 'ERREUR : pas de distribution ZIP' >&2
            exit 1
          fi
          archive="${archives[0]}"
          sha256sum "$archive" > OFBIZ_PIECES/ORIGINAL_SHA256.txt
          basename "$archive" > OFBIZ_PIECES/NOM_ORIGINAL.txt
          split -b 150M -d -a 3 "$archive" OFBIZ_PIECES/OFBIZ_PART_
          ls -lh OFBIZ_PIECES

      - name: Mettre la distribution a disposition
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OFBIZ_24_09_08_PARTIES
          path: OFBIZ_PIECES/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Conserver les journaux de compilation et de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIAGNOSTIC_OFBIZ
          path: |
            COMPILATION_OFBIZ.log
            TESTS_INTEGRATION_OFBIZ.log
          if-no-files-found: warn
          retention-days: 7
